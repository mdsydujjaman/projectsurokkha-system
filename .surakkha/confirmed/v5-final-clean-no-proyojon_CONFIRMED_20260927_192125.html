<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔒 Surokkha System</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px;margin:0}
.box{border:1px solid #333;border-radius:12px;padding:20px;margin:12px 0;background:#111;text-align:center}
.btn{padding:14px;border:none;border-radius:10px;width:100%;margin:8px 0;font-weight:bold;font-size:16px;cursor:pointer}
.btn-g{background:#fff;color:#000} .btn-r{background:#222;color:#fff;border:1px solid #444}
input{width:100%;padding:14px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;margin:8px 0;text-align:center;font-size:16px}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.hidden{display:none}
</style></head><body>
<div id="lockScreen"><div class="box" style="max-width:360px;width:100%"><h2>🔒 Project Surokkha System</h2><p style="color:#888;font-size:12px;margin:8px 0">Secure Access</p><input type="password" id="lockInput" placeholder="Password"><p id="attemptMsg" style="color:#ff4444;min-height:20px"></p><button class="btn btn-g" onclick="unlock()">🔓 Unlock</button><p style="margin-top:10px"><span onclick="forceReset()" style="color:#888;font-size:12px;text-decoration:underline;cursor:pointer">Reset to 1234</span></p></div></div>

<div id="setupPage" class="box"><h2>🔒 Surokkha System</h2><p style="color:#888;font-size:13px">Setup Your System</p><input type="text" id="newPassEasy" placeholder="New Password"><input type="text" id="projectEasy" placeholder="Project Name"><button class="btn btn-g" onclick="easySetup()">SAVE & ENTER</button><button class="btn btn-r" onclick="clearEverything()">Clear All</button><p id="easyMsg" style="min-height:20px;margin-top:10px;color:#0f0"></p></div>

<div id="mainPage" class="hidden">
<div class="box"><h1>✅ Surokkha Dashboard</h1><p style="color:#888">তুমি ভিতরে ঢুকে গেছো!</p><p id="projectDisplay" style="font-size:22px;color:#FFD700;margin:20px 0;font-weight:bold"></p><button class="btn btn-r" onclick="lockNow()">🔒 Lock System</button></div>
<div class="box"><h3>🔐 System Status</h3><p style="color:#0f0">✔ Password Protected</p><p style="color:#0f0">✔ Project Locked</p><p style="color:#444;font-size:11px;margin-top:10px">projectsurokkhasystem.com</p></div>
</div>

<script>
function init(){let u=sessionStorage.getItem('surokkha_unlocked');let p=localStorage.getItem('surokkha_project')||'projectsurokkha-system';document.getElementById('projectDisplay').innerText='📁 '+p;document.getElementById('projectEasy').value=p;if(u==='yes'){document.getElementById('lockScreen').style.display='none';document.getElementById('setupPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');}}
function getPass(){let s=localStorage.getItem('surokkha_pass');if(!s)return'1234';try{return atob(s)}catch(e){return'1234'}}
function easySetup(){let np=document.getElementById('newPassEasy').value.trim();let pj=document.getElementById('projectEasy').value.trim()||'projectsurokkha-system';if(np.length<3){document.getElementById('easyMsg').innerText='Password দাও';return;}localStorage.setItem('surokkha_pass',btoa(np));localStorage.setItem('surokkha_project',pj);sessionStorage.setItem('surokkha_unlocked','yes');document.getElementById('lockScreen').style.display='none';document.getElementById('setupPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');document.getElementById('projectDisplay').innerText='📁 '+pj;}
function unlock(){let inp=document.getElementById('lockInput').value.trim();if(inp===getPass()){sessionStorage.setItem('surokkha_unlocked','yes');document.getElementById('lockScreen').style.display='none';document.getElementById('setupPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');}else{document.getElementById('attemptMsg').innerText='Wrong Password!'}document.getElementById('lockInput').value='';}
function lockNow(){sessionStorage.removeItem('surokkha_unlocked');location.reload();}
function clearEverything(){if(confirm('Clear?')){localStorage.clear();sessionStorage.clear();location.reload();}}
function forceReset(){localStorage.setItem('surokkha_pass',btoa('1234'));alert('Reset 1234');location.reload();}
window.onload=init;
</script></body></html>
