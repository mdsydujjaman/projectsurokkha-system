<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔒 Surokkha V4.8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:15px}
.glass{background:rgba(255,255,255,0.05);border:1px solid #00FF88;border-radius:16px;padding:20px;margin:12px 0;text-align:center}
.btn{padding:14px 20px;border:none;border-radius:12px;margin:6px;cursor:pointer;font-weight:bold;font-size:16px;width:90%}
.btn-g{background:#00FF88;color:#000} .btn-r{background:#ff4444;color:#fff}
.input-big{background:#000;color:#FFD700;border:2px solid #FFD700;border-radius:12px;padding:14px;width:90%;margin:8px;text-align:center;font-size:18px}
.lock-title{font-size:30px;color:#00FF88;font-weight:bold;text-shadow:0 0 15px #00FF88}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0e1a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:rgba(255,255,255,0.08);border:2px solid #00FF88;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
</style></head>
<body>
<div id="lockScreen"><div class="lock-box"><div style="font-size:60px">🔒</div><div class="lock-title">Project Surokkha System</div><p style="color:#aaa;margin:10px 0">V4.8 - ProyojonX Allowed</p><input type="password" id="lockInput" class="input-big" placeholder="Password - 1234" style="border-color:#00FF88;color:#00FF88"><div id="attemptMsg" style="color:#ff4444;margin:10px;min-height:20px"></div><button class="btn btn-g" onclick="unlock()">🔓 ঢুকো</button><p style="margin-top:10px;color:#555;font-size:12px"><span onclick="forceReset()" style="color:#FFD700;cursor:pointer;text-decoration:underline">Password ভুলে গেছো? Reset 1234</span></p></div></div>

<div class="glass"><h1>🔒 Project Surokkha System</h1><p style="color:#00FF88">V4.8 - Easy Setup | ProyojonX Allowed</p>

<div style="background:rgba(0,255,136,0.1);border:1px dashed #00FF88;border-radius:12px;padding:15px;margin:15px 0">
<p style="color:#FFD700;font-weight:bold">🔑 নতুন Password (Old লাগবে না)</p>
<input type="text" id="newPassEasy" class="input-big" placeholder="Password লিখো - যেমন 1234">
<p style="color:#FFD700;font-weight:bold;margin-top:10px">📁 প্রজেক্ট নাম (proyojon-x লিখতে পারবে)</p>
<input type="text" id="projectEasy" class="input-big" placeholder="যেমন proyojon-x বা অন্য নাম">
<button class="btn btn-g" onclick="easySetup()">✅ SAVE & ENTER</button>
<button class="btn btn-r" onclick="clearEverything()">🧹 সব Clear</button>
<div id="easyMsg" style="color:#00FF88;margin-top:15px;font-weight:bold;min-height:20px"></div>
<p style="color:#555;font-size:10px;margin-top:10px">Default: projectsurokkha-system | তুমি proyojon-x Set করতে পারবে</p>
</div>
</div>

<script>
function init(){if(sessionStorage.getItem('surokkha_unlocked')==='yes'){document.getElementById('lockScreen').style.display='none';}let saved=localStorage.getItem('surokkha_project');if(saved){document.getElementById('projectEasy').placeholder=saved;}}
function getPass(){let s=localStorage.getItem('surokkha_pass');if(!s) return '1234';try{return atob(s);}catch(e){return '1234';}}
function easySetup(){
let np=document.getElementById('newPassEasy').value.trim();
let pj=document.getElementById('projectEasy').value.trim();
if(!np || np.length<3){document.getElementById('easyMsg').style.color='#ff4444';document.getElementById('easyMsg').innerText='❌ Password দাও!';return;}
if(!pj){pj='projectsurokkha-system';}
localStorage.setItem('surokkha_pass',btoa(np));
localStorage.setItem('surokkha_project',pj);
sessionStorage.setItem('surokkha_unlocked','yes');
document.getElementById('easyMsg').style.color='#00FF88';
document.getElementById('easyMsg').innerText='✅ Saved! Pass: '+np+' | Project: '+pj+' | ঢুকে গেছো!';
document.getElementById('lockScreen').style.display='none';
setTimeout(()=>{location.reload();},1200);
}
function clearEverything(){if(confirm('সব Delete?')){localStorage.clear();sessionStorage.clear();location.reload();}}
function forceReset(){if(confirm('Reset to 1234?')){localStorage.setItem('surokkha_pass',btoa('1234'));alert('✅ 1234 করা হয়েছে');location.reload();}}
function unlock(){let inp=document.getElementById('lockInput').value.trim();let cur=getPass();if(inp===cur){document.getElementById('lockScreen').style.display='none';sessionStorage.setItem('surokkha_unlocked','yes');}else{document.getElementById('attemptMsg').innerText='❌ ভুল! Reset চাপো';}document.getElementById('lockInput').value='';}
window.onload=init;
</script>
</body>
</html>
