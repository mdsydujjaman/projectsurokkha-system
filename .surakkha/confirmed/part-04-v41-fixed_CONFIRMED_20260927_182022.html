<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Surokkha V4.1 Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:15px}
.glass{background:rgba(255,255,255,0.05);border:1px solid rgba(0,255,136,0.2);border-radius:16px;padding:18px;margin:12px 0}
h1{color:#00FF88;font-size:26px;text-align:center}
.btn{padding:10px 16px;border:none;border-radius:10px;margin:4px;cursor:pointer;font-weight:bold}
.btn-g{background:#00FF88;color:#000} .btn-r{background:#ff4444;color:#fff}
.project-name{font-size:26px;color:#FFD700;text-align:center;font-weight:bold;margin:10px 0}
input{background:#000;color:#00FF88;border:2px solid #00FF88;border-radius:8px;padding:12px;width:75%;margin:5px;text-align:center}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0e1a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:rgba(255,255,255,0.08);border:2px solid #00FF88;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
</style>
</head>
<body>
<div id="lockScreen"><div class="lock-box"><div style="font-size:70px">🔒</div><h2 style="color:#00FF88">Surokkha Locked</h2><div class="project-name" id="lockProjectName">📁 projectsurokkha-system</div><p style="color:#aaa;font-size:13px">Default: 1234</p><input type="password" id="lockInput" placeholder="Password" onkeypress="if(event.key==='Enter')unlock()"><div id="attemptMsg" style="color:#ff4444;margin:10px 0;min-height:20px"></div><button class="btn btn-g" style="width:90%" onclick="unlock()">Unlock</button></div></div>
<div class="glass"><h1>🔒 Surokkha V4.1 Fixed</h1><div class="project-name" id="projectNameDisplay">📁 projectsurokkha-system</div><div style="text-align:center"><input type="text" id="projectInput" placeholder="ProyojonX"><button class="btn btn-g" onclick="setProjectName()">Set Project</button><button class="btn btn-r" onclick="lockNow()">Lock</button></div></div>
<div class="glass"><h2>Password Change</h2><input type="password" id="oldPass" placeholder="Old 1234"><input type="password" id="newPassChange" placeholder="New"><button class="btn btn-g" onclick="changePassword()">Change</button><div id="passMsg" style="color:#00FF88;margin-top:10px"></div></div>
<script>
let currentProject=localStorage.getItem('surokkha_project')||'projectsurokkha-system';let attempts=0;
function initLock(){document.getElementById('lockProjectName').innerText='📁 '+currentProject;document.getElementById('projectNameDisplay').innerText='📁 '+currentProject;document.getElementById('projectInput').value=currentProject;if(sessionStorage.getItem('surokkha_unlocked')==='yes'){document.getElementById('lockScreen').style.display='none';}}
function unlock(){const input=document.getElementById('lockInput').value;const saved=localStorage.getItem('surokkha_pass')||btoa('1234');if(btoa(input)===saved||input==='1234'){document.getElementById('lockScreen').style.display='none';sessionStorage.setItem('surokkha_unlocked','yes');if(!localStorage.getItem('surokkha_pass'))localStorage.setItem('surokkha_pass',btoa('1234'));}else{attempts++;document.getElementById('attemptMsg').innerText='Wrong! '+(3-attempts)+' left';if(attempts>=3){document.getElementById('lockInput').disabled=true;setTimeout(()=>{document.getElementById('lockInput').disabled=false;attempts=0;document.getElementById('attemptMsg').innerText='';},30000);}document.getElementById('lockInput').value='';}}
function lockNow(){sessionStorage.removeItem('surokkha_unlocked');document.getElementById('lockScreen').style.display='flex';}
function changePassword(){const oldP=document.getElementById('oldPass').value;const newP=document.getElementById('newPassChange').value;const saved=localStorage.getItem('surokkha_pass')||btoa('1234');if(btoa(oldP)!==saved){document.getElementById('passMsg').innerText='Old Wrong!';return;}if(newP.length<4){document.getElementById('passMsg').innerText='Min 4 char!';return;}localStorage.setItem('surokkha_pass',btoa(newP));document.getElementById('passMsg').innerText='✅ Changed to: '+newP;document.getElementById('oldPass').value='';document.getElementById('newPassChange').value='';}
function setProjectName(){const name=document.getElementById('projectInput').value.trim();if(!name){alert('Name!');return;}localStorage.setItem('surokkha_project',name);currentProject=name;document.getElementById('projectNameDisplay').innerText='📁 '+name;document.getElementById('lockProjectName').innerText='📁 '+name;alert('✅ Set: '+name+' - No more loop!');}
window.onload=initLock;
</script>
</body>
</html>
