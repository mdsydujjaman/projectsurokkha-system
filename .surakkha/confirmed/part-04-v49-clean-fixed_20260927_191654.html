<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔒 Project Surokkha System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:15px}
.glass{background:rgba(255,255,255,0.05);border:1px solid #00FF88;border-radius:16px;padding:20px;margin:12px 0;text-align:center}
.btn{padding:14px 20px;border:none;border-radius:12px;margin:6px;cursor:pointer;font-weight:bold;font-size:16px;width:90%}
.btn-g{background:#00FF88;color:#000} .btn-r{background:#ff4444;color:#fff} .btn-o{background:#333;color:#00FF88;border:1px solid #00FF88}
.input-big{background:#000;color:#FFD700;border:2px solid #FFD700;border-radius:12px;padding:14px;width:90%;margin:8px;text-align:center;font-size:18px}
.lock-title{font-size:30px;color:#00FF88;font-weight:bold;text-shadow:0 0 15px #00FF88}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0e1a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:rgba(255,255,255,0.08);border:2px solid #00FF88;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
.hidden{display:none}
</style></head>
<body>
<div id="lockScreen"><div class="lock-box"><div style="font-size:60px">🔒</div><div class="lock-title">Project Surokkha System</div><p style="color:#aaa;margin:10px 0">Secure Access</p><input type="password" id="lockInput" class="input-big" placeholder="Password" style="border-color:#00FF88;color:#00FF88"><div id="attemptMsg" style="color:#ff4444;margin:10px;min-height:20px"></div><button class="btn btn-g" onclick="unlock()">🔓 Unlock</button><p style="margin-top:12px;color:#555;font-size:12px"><span onclick="forceReset()" style="color:#FFD700;cursor:pointer;text-decoration:underline">Reset to 1234</span></p></div></div>

<div id="setupPage" class="glass">
<h1>🔒 Project Surokkha System</h1>
<div style="background:rgba(0,255,136,0.1);border:1px dashed #00FF88;border-radius:12px;padding:15px;margin:15px 0">
<p style="color:#FFD700;font-weight:bold">🔑 নতুন Password</p>
<input type="text" id="newPassEasy" class="input-big" placeholder="Password লিখো">
<p style="color:#FFD700;font-weight:bold;margin-top:10px">📁 প্রজেক্ট নাম</p>
<input type="text" id="projectEasy" class="input-big" placeholder="Project Name লিখো">
<button class="btn btn-g" onclick="easySetup()">✅ SAVE & ENTER</button>
<button class="btn btn-r" onclick="clearEverything()">🧹 Clear All</button>
<div id="easyMsg" style="color:#00FF88;margin-top:15px;font-weight:bold;min-height:20px"></div>
</div>
</div>

<div id="mainPage" class="hidden">
<div class="glass"><h1>✅ Surokkha Dashboard</h1><p style="color:#00FF88">তুমি ভিতরে ঢুকে গেছো!</p><div style="font-size:22px;color:#FFD700;font-weight:bold;margin:15px 0" id="projectDisplay">📁 projectsurokkha-system</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-g" onclick="goProyojon()" style="width:45%">🚀 ProyojonX এ যাও</button><button class="btn btn-r" onclick="lockNow()" style="width:45%">🔒 Lock</button></div></div>
<div class="glass"><h2>🔐 System Status</h2><p style="color:#00FF88">✔ Password Protected</p><p style="color:#00FF88">✔ Project Locked</p><p style="color:#555;font-size:11px;margin-top:10px">projectsurokkhasystem.com</p></div>
</div>

<script>
let curProject='projectsurokkha-system';
function init(){
let unlocked=sessionStorage.getItem('surokkha_unlocked');
let proj=localStorage.getItem('surokkha_project');
if(proj) curProject=proj;
document.getElementById('projectDisplay').innerText='📁 '+curProject;
document.getElementById('projectEasy').value=proj||'';
if(unlocked==='yes'){
document.getElementById('lockScreen').style.display='none';
document.getElementById('setupPage').classList.add('hidden');
document.getElementById('mainPage').classList.remove('hidden');
}
}
function getPass(){let s=localStorage.getItem('surokkha_pass');if(!s) return '1234';try{return atob(s);}catch(e){return '1234';}}
function easySetup(){
let np=document.getElementById('newPassEasy').value.trim();
let pj=document.getElementById('projectEasy').value.trim();
if(!np || np.length<3){document.getElementById('easyMsg').style.color='#ff4444';document.getElementById('easyMsg').innerText='❌ Password দাও';return;}
if(!pj) pj='projectsurokkha-system';
localStorage.setItem('surokkha_pass',btoa(np));
localStorage.setItem('surokkha_project',pj);
sessionStorage.setItem('surokkha_unlocked','yes');
document.getElementById('easyMsg').style.color='#00FF88';
document.getElementById('easyMsg').innerText='✅ Saved! ভিতরে ঢুকছো...';
setTimeout(()=>{
document.getElementById('lockScreen').style.display='none';
document.getElementById('setupPage').classList.add('hidden');
document.getElementById('mainPage').classList.remove('hidden');
document.getElementById('projectDisplay').innerText='📁 '+pj;
},800);
}
function unlock(){
let inp=document.getElementById('lockInput').value.trim();
let cur=getPass();
if(inp===cur){
sessionStorage.setItem('surokkha_unlocked','yes');
document.getElementById('lockScreen').style.display='none';
document.getElementById('setupPage').classList.add('hidden');
document.getElementById('mainPage').classList.remove('hidden');
}else{
document.getElementById('attemptMsg').innerText='❌ ভুল Password!';
}
document.getElementById('lockInput').value='';
}
function lockNow(){sessionStorage.removeItem('surokkha_unlocked');location.reload();}
function clearEverything(){if(confirm('সব Clear?')){localStorage.clear();sessionStorage.clear();location.reload();}}
function forceReset(){if(confirm('Reset to 1234?')){localStorage.setItem('surokkha_pass',btoa('1234'));alert('✅ 1234');location.reload();}}
function goProyojon(){alert('ProyojonX আলাদা Repo তে বানাবো?');}
window.onload=init;
</script>
</body>
</html>
