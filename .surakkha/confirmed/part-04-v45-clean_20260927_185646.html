<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔒 Project Surokkha System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:15px}
.glass{background:rgba(255,255,255,0.05);border:1px solid #00FF88;border-radius:16px;padding:18px;margin:12px 0}
.btn{padding:10px 16px;border:none;border-radius:10px;margin:4px;cursor:pointer;font-weight:bold}
.btn-g{background:#00FF88;color:#000} .btn-r{background:#ff4444;color:#fff} .btn-o{background:#333;color:#00FF88;border:1px solid #00FF88}
.project-name{font-size:22px;color:#FFD700;text-align:center;font-weight:bold;margin:10px 0}
.lock-title{font-size:28px;color:#00FF88;text-align:center;font-weight:bold;margin:10px 0;text-shadow:0 0 15px #00FF88}
.input-group{position:relative;width:85%;margin:5px auto;display:flex;align-items:center}
.input-group input{background:#000;color:#00FF88;border:2px solid #00FF88;border-radius:8px;padding:12px;width:100%;text-align:center}
.eye{position:absolute;right:10px;cursor:pointer;font-size:20px}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a 0%,#0f1a2e 100%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:rgba(255,255,255,0.08);border:2px solid #00FF88;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
</style></head>
<body>
<div id="lockScreen"><div class="lock-box"><div style="font-size:60px">🔒</div><div class="lock-title">Project Surokkha System</div><p style="color:#00FF88;font-size:13px">projectsurokkhasystem.com</p><p style="color:#aaa;font-size:12px;margin-bottom:10px">🔐 Secure Password Protected</p><div class="input-group"><input type="password" id="lockInput" placeholder="Enter Password"><span class="eye" onclick="toggle('lockInput',this)">👁️</span></div><div id="attemptMsg" style="color:#ff4444;margin:10px 0;min-height:20px"></div><button class="btn btn-g" style="width:90%" onclick="unlock()">🔓 Unlock</button></div></div>

<div class="glass"><h1>🔒 Project Surokkha System</h1><p style="text-align:center;color:#00FF88">V4.5 Clean - No Example Project</p><div class="project-name" id="projectNameDisplay">📁 projectsurokkha-system</div><div style="text-align:center"><input type="text" id="projectInput" placeholder="Enter Your Project Name" style="background:#000;color:#FFD700;border:2px solid #FFD700;border-radius:8px;padding:10px;width:60%"><button class="btn btn-g" onclick="setProjectName()">Set</button><button class="btn btn-r" onclick="lockNow()">Lock</button></div></div>

<div class="glass"><h2>🔑 Password Settings</h2><p style="font-size:11px">Status: <span id="currentPassShow" style="color:#00FF88">Protected</span> <span onclick="showCurrentPass()" style="color:#FFD700;cursor:pointer">👁️ Show</span></p><div class="input-group"><input type="password" id="oldPass" placeholder="Old Password"><span class="eye" onclick="toggle('oldPass',this)">👁️</span></div><div class="input-group"><input type="password" id="newPassChange" placeholder="New Password"><span class="eye" onclick="toggle('newPassChange',this)">👁️</span></div><button class="btn btn-g" onclick="changePassword()">Change</button><button class="btn btn-o" onclick="resetPass()">Reset to 1234</button><div id="passMsg" style="margin-top:10px;min-height:20px"></div></div>

<div class="glass" style="text-align:center"><p>🌐 <a href="https://mdsydujjaman.github.io/projectsurokkha-system/" style="color:#00FF88">Live Site</a></p><p style="color:#555;font-size:11px">V4.5 Clean System - Only Surokkha</p></div>

<script>
let currentProject=localStorage.getItem('surokkha_project')||'projectsurokkha-system';let attempts=0;
function initLock(){document.getElementById('projectNameDisplay').innerText='📁 '+currentProject;document.getElementById('projectInput').value=currentProject;if(sessionStorage.getItem('surokkha_unlocked')==='yes'){document.getElementById('lockScreen').style.display='none';}}
function toggle(id,el){const inp=document.getElementById(id);if(inp.type==='password'){inp.type='text';el.innerText='🙈';}else{inp.type='password';el.innerText='👁️';}}
function getCurrentPass(){const saved=localStorage.getItem('surokkha_pass');if(!saved) return '1234';try{return atob(saved);}catch(e){return '1234';}}
function showCurrentPass(){const pass=getCurrentPass();if(confirm('Show Password?')){document.getElementById('currentPassShow').innerText=pass;document.getElementById('oldPass').value=pass;}}
function unlock(){const input=document.getElementById('lockInput').value.trim();const currentPass=getCurrentPass();if(input===currentPass){document.getElementById('lockScreen').style.display='none';sessionStorage.setItem('surokkha_unlocked','yes');document.getElementById('attemptMsg').innerText='';}else{attempts++;document.getElementById('attemptMsg').innerText='❌ Wrong Password! '+(3-attempts)+' left';if(attempts>=3){document.getElementById('lockInput').disabled=true;setTimeout(()=>{document.getElementById('lockInput').disabled=false;attempts=0;document.getElementById('attemptMsg').innerText='';},30000);}}document.getElementById('lockInput').value='';}
function lockNow(){sessionStorage.removeItem('surokkha_unlocked');document.getElementById('lockScreen').style.display='flex';}
function changePassword(){const oldP=document.getElementById('oldPass').value.trim();const newP=document.getElementById('newPassChange').value.trim();const currentPass=getCurrentPass();if(oldP!==currentPass){document.getElementById('passMsg').style.color='#ff4444';document.getElementById('passMsg').innerText='❌ Old Wrong!';return;}if(newP.length<4){document.getElementById('passMsg').style.color='#ff4444';document.getElementById('passMsg').innerText='❌ Min 4 chars!';return;}localStorage.setItem('surokkha_pass',btoa(newP));document.getElementById('passMsg').style.color='#00FF88';document.getElementById('passMsg').innerText='✅ Password Changed!';document.getElementById('oldPass').value='';document.getElementById('newPassChange').value='';document.getElementById('currentPassShow').innerText='Protected';}
function resetPass(){if(confirm('Reset to 1234?')){localStorage.setItem('surokkha_pass',btoa('1234'));document.getElementById('passMsg').style.color='#00FF88';document.getElementById('passMsg').innerText='✅ Reset to 1234';}}
function setProjectName(){const name=document.getElementById('projectInput').value.trim();if(!name){alert('Enter name!');return;}localStorage.setItem('surokkha_project',name);currentProject=name;document.getElementById('projectNameDisplay').innerText='📁 '+name;alert('✅ Project Set: '+name);}
window.onload=initLock;
</script>
</body>
</html>
