<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Project Surokkha V4 - Locked</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:15px}
.glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(0,255,136,0.2);border-radius:16px;padding:18px;margin:12px 0}
h1{color:#00FF88;font-size:26px;text-align:center}
.btn{padding:10px 16px;border:none;border-radius:10px;margin:4px;cursor:pointer;font-weight:bold}
.btn-g{background:#00FF88;color:#000} .btn-r{background:#ff4444;color:#fff} .btn-o{background:rgba(255,255,255,0.1);color:#00FF88;border:1px solid #00FF88}
.project-name{font-size:26px;color:#FFD700;text-align:center;font-weight:bold;margin:10px 0}
input{background:#000;color:#00FF88;border:2px solid #00FF88;border-radius:8px;padding:12px;width:75%;margin:5px;font-size:16px;text-align:center}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a 0%,#1a1f3a 100%);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lock-box{background:rgba(255,255,255,0.08);border:2px solid #00FF88;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
</style>
</head>
<body>
<div id="lockScreen">
<div class="lock-box">
<div style="font-size:70px">🔒</div>
<h2 style="color:#00FF88">Surokkha Locked</h2>
<div class="project-name" id="lockProjectName">📁 projectsurokkha-system</div>
<p style="color:#aaa;font-size:13px;margin:10px 0">অন্য কেউ ঢুকতে পারবে না</p>
<input type="password" id="lockInput" placeholder="🔑 Password - Default 1234" onkeypress="if(event.key==='Enter')unlock()">
<div id="attemptMsg" style="color:#ff4444;font-size:13px;margin:10px 0;min-height:20px"></div>
<button class="btn btn-g" style="width:90%" onclick="unlock()">🔓 Unlock</button>
<p style="color:#555;font-size:11px;margin-top:15px">Default: 1234<br>projectsurokkhasystem.com</p>
</div>
</div>
<div class="glass">
<h1>🔒 Project Surokkha System</h1>
<p style="text-align:center;color:#00FF88">V4 Password Protected</p>
<div class="project-name" id="projectNameDisplay">📁 projectsurokkha-system</div>
<p style="text-align:center;color:#aaa">🔐 অন্য কেউ ঢুকতে পারবে না</p>
<div style="text-align:center">
<input type="text" id="projectInput" placeholder="ProyojonX">
<button class="btn btn-g" onclick="setProjectName()">✅ Set Project</button>
<button class="btn btn-r" onclick="lockNow()">🔒 Lock</button>
</div>
</div>
<div class="glass">
<h2>🔑 Password Change</h2>
<input type="password" id="oldPass" placeholder="পুরানো Password">
<input type="password" id="newPassChange" placeholder="নতুন Password">
<button class="btn btn-g" onclick="changePassword()">🔄 Change</button>
</div>
<div class="glass" style="text-align:center">
<p>🌐 <a href="https://mdsydujjaman.github.io/projectsurokkha-system/" style="color:#00FF88">Live Site</a></p>
<p style="color:#aaa;font-size:12px">V4 Locked - Self-Locked 444</p>
</div>
<script>
let currentProject=localStorage.getItem('surokkha_project')||'projectsurokkha-system';
let attempts=0;
function initLock(){
document.getElementById('lockProjectName').innerText='📁 '+currentProject;
document.getElementById('projectNameDisplay').innerText='📁 '+currentProject;
}
function unlock(){
const input=document.getElementById('lockInput').value;
const saved=localStorage.getItem('surokkha_pass')||btoa('1234');
if(btoa(input)===saved){document.getElementById('lockScreen').style.display='none';}else{attempts++;document.getElementById('attemptMsg').innerText='❌ ভুল! '+(3-attempts)+' বার বাকি';if(attempts>=3){document.getElementById('lockInput').disabled=true;setTimeout(()=>{document.getElementById('lockInput').disabled=false;attempts=0;document.getElementById('attemptMsg').innerText='';},60000);}document.getElementById('lockInput').value='';}
}
function lockNow(){document.getElementById('lockScreen').style.display='flex';}
function changePassword(){
const oldP=document.getElementById('oldPass').value;
const newP=document.getElementById('newPassChange').value;
const saved=localStorage.getItem('surokkha_pass')||btoa('1234');
if(btoa(oldP)!==saved && oldP!=='1234'){alert('পুরানো Password ভুল!');return;}
if(newP.length<4){alert('৪ অক্ষরের বেশি দাও!');return;}
localStorage.setItem('surokkha_pass',btoa(newP));alert('✅ Password Change!');document.getElementById('oldPass').value='';document.getElementById('newPassChange').value='';
}
function setProjectName(){
const name=document.getElementById('projectInput').value.trim();
if(!name){alert('নাম লিখো!');return;}
localStorage.setItem('surokkha_project',name);location.reload();
}
window.onload=initLock;
</script>
</body>
</html>
